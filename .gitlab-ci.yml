stages:
  - oidc-verify

variables:
  AWS_DEFAULT_REGION: "ap-northeast-2"
  AWS_REGION: "ap-northeast-2"
  AWS_STS_REGIONAL_ENDPOINTS: "regional"

oidc:verify-aws:
  stage: oidc-verify
  image:
    name: amazon/aws-cli:2.27.49
    entrypoint: [""]
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: sts.amazonaws.com
  rules:
    - if: '$CI_COMMIT_BRANCH == "feature/S15P11A707-203-deploy-docker"'
    - when: never
  script:
    - |
      set -eu

      if [ -z "${AWS_OIDC_ROLE_ARN:-}" ]; then
        echo "AWS_OIDC_ROLE_ARN is not configured."
        exit 1
      fi

      if [ -z "${GITLAB_OIDC_TOKEN:-}" ]; then
        echo "GitLab OIDC ID token was not issued."
        exit 1
      fi

      aws_sts_output="$(
        aws sts assume-role-with-web-identity \
          --role-arn "${AWS_OIDC_ROLE_ARN}" \
          --role-session-name "gitlab-${CI_PROJECT_ID}-${CI_PIPELINE_ID}" \
          --web-identity-token "${GITLAB_OIDC_TOKEN}" \
          --duration-seconds 900 \
          --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
          --output text
      )"

      set -- ${aws_sts_output}
      if [ "$#" -ne 3 ]; then
        echo "AWS STS did not return the expected temporary credentials."
        exit 1
      fi

      export AWS_ACCESS_KEY_ID="$1"
      export AWS_SECRET_ACCESS_KEY="$2"
      export AWS_SESSION_TOKEN="$3"
      unset aws_sts_output GITLAB_OIDC_TOKEN

      aws sts get-caller-identity >/dev/null
      echo "GitLab OIDC to AWS STS authentication succeeded."
