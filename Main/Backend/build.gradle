plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ssafy'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    implementation 'io.livekit:livekit-server:0.13.0'
    implementation platform('software.amazon.awssdk:bom:2.41.14')
    implementation 'software.amazon.awssdk:s3'
    // REPORTS-03: 렌더링된 마크다운을 PDF로 변환. 순수 자바 구현이라 네이티브 바이너리(wkhtmltopdf 등) 의존이 없다.
    implementation 'io.github.openhtmltopdf:openhtmltopdf-pdfbox:1.1.66'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

// 테스트용 JWT 키.
// 키 파일(*.pem)은 저장소에 올리지 않는다. 로컬에 키가 없으면(새로 clone한 상태) 테스트 실행 전에
// 일회용 RSA 키 쌍을 build/ 아래에 만들어 테스트 클래스패스(keys/)에만 올린다.
// 로컬 키가 있으면(src/main/resources/keys 또는 src/test/resources/keys) 그 키를 그대로 쓴다.
def hasLocalJwtKeys = [
        'src/main/resources/keys/jwt_private.pem',
        'src/test/resources/keys/jwt_private.pem'
].any { file(it).exists() }
def generatedTestJwtKeysDir = layout.buildDirectory.dir('generated/test-jwt-keys')

def generateTestJwtKeys = tasks.register('generateTestJwtKeys') {
    description = '로컬에 JWT 키가 없을 때 테스트 전용 RSA 키 쌍(PKCS#8 개인키·X.509 공개키 PEM)을 만든다.'
    group = 'verification'
    outputs.dir(generatedTestJwtKeysDir)
    doLast {
        def keysDir = new File(generatedTestJwtKeysDir.get().asFile, 'keys')
        keysDir.mkdirs()
        def generator = java.security.KeyPairGenerator.getInstance('RSA')
        generator.initialize(2048)
        def pair = generator.generateKeyPair()
        def lineBreak = System.lineSeparator()
        def encoder = Base64.getMimeEncoder(64, lineBreak.getBytes('US-ASCII'))
        def pem = { String label, byte[] der ->
            ["-----BEGIN ${label}-----", encoder.encodeToString(der), "-----END ${label}-----", ''].join(lineBreak)
        }
        new File(keysDir, 'jwt_private.pem').setText(pem('PRIVATE KEY', pair.private.encoded), 'US-ASCII')
        new File(keysDir, 'jwt_public.pem').setText(pem('PUBLIC KEY', pair.public.encoded), 'US-ASCII')
    }
}

if (!hasLocalJwtKeys) {
    sourceSets.test.resources.srcDir(generateTestJwtKeys)
}

// 테스트는 두 층으로 나눈다.
// - test: DB·Redis 없이 도는 단위 테스트(Mockito·standalone MockMvc). 수 초 안에 끝난다.
// - integrationTest: @Tag("integration") — 스프링 컨텍스트를 띄우고 실제 PostgreSQL·Redis에 붙는다.
// check(build)는 둘 다 돌린다.
tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'integration'
    }
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = false
    }
}

tasks.register('integrationTest', Test) {
    description = '실제 PostgreSQL·Redis에 붙는 통합 테스트(@Tag("integration"))를 실행한다.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'integration'
    }
    shouldRunAfter tasks.named('test')
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = false
    }
}

tasks.named('check') {
    dependsOn tasks.named('integrationTest')
}
