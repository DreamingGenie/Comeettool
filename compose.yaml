# 로컬 개발·테스트용 의존 서비스 — PostgreSQL 17(pgvector)과 Redis.
# 애플리케이션 서버(Backend · Yjs · AI · Frontend)는 포함하지 않는다. 실행 순서는 README "실행 방법".
#
#   docker compose up -d        # 처음 띄울 때 스키마(Flyway V1~V4 덤프)가 자동으로 들어간다
#   docker compose down         # 내리기 (데이터 유지)
#   docker compose down -v      # 내리면서 DB 볼륨까지 삭제 — 다음에 띄우면 빈 스키마로 다시 만든다
#
# 5432·6379가 이미 쓰이고 있으면 포트를 바꿔 띄운다.
#   COMEETTOOL_PG_PORT=15432 COMEETTOOL_REDIS_PORT=16379 docker compose up -d
#   (이때 Main/Backend/.env의 DB_URL·REDIS_PORT도 같은 값으로 맞춘다)

name: comeettool

services:
  postgres:
    # 운영 RDS·스키마 덤프와 같은 메이저 버전. V4 마이그레이션이 pgvector 확장을 쓴다.
    image: pgvector/pgvector:pg17
    environment:
      # 로컬 전용 값. Main/Backend/.env.example·application.yml(local)의 기본값과 같다.
      POSTGRES_DB: comeettool
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:${COMEETTOOL_PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 데이터 디렉터리가 비어 있을 때(첫 실행)만 실행된다.
      - ./exec/database/comeettool_dump.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d comeettool"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    # 로그인 Refresh Token 저장소.
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${COMEETTOOL_REDIS_PORT:-6379}:6379"

volumes:
  pgdata:
