spring:
  application:
    name: backend
  profiles:
    active: local

# actuator: 헬스체크만 노출 (스캐폴딩 동작 확인용)
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized

---
# ===== local (개인 로컬 개발) =====
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/commonpjt
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate   # 스키마는 database-schema.md DDL로 생성, JPA는 검증만 (Flyway 미사용)
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
  # 로컬에서 Redis 미실행 시 /actuator/health 가 DOWN 되지 않도록 헬스체크 제외 (F1 확인용)
management:
  health:
    redis:
      enabled: false

---
# ===== prod (배포, 공용 서버 DB) — 값은 환경변수/CI에서 주입 =====
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
